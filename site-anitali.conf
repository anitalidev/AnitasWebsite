
<VirtualHost *:443>
    ServerName anitali.ca
    ServerAlias www.anitali.ca

    DocumentRoot /var/www/MyWebsite/frontend/dist

    <Directory /var/www/MyWebsite/frontend/dist>
        Options FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/anitali.ca_error.log
    CustomLog ${APACHE_LOG_DIR}/anitali.ca_access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/anitali.ca/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/anitali.ca/privkey.pem
</VirtualHost>

